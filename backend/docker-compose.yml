x-app: &app
  build: .
  env_file: .env
  volumes:
    - ./media:/app/media
  depends_on: [db, redis]
  restart: unless-stopped

services:
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    ports: ["127.0.0.1:8020:8000"]
  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency 4
  beat:
    <<: *app
    command: celery -A config beat -l info
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pet24
      POSTGRES_USER: pet24
      POSTGRES_PASSWORD: pet24
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
