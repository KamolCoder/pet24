{% extends "staff/base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h2>Вход для сотрудников</h2>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="msg error">Неверный телефон или пароль</div>{% endif %}
    <p><label>Телефон<br><input name="username" placeholder="90 123 45 67" autofocus></label></p>
    <p><label>Пароль<br><input name="password" type="password"></label></p>
    <button>Войти</button>
  </form>
</div>
{% endblock %}
