<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pet24 — сборка{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root { --brand: #ff7300; --bg: #f5f5f5; --card: #fff; --muted: #777; --danger: #d32f2f; --ok: #2e7d32; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: #222; }
  header { background: var(--brand); color: #fff; padding: 10px 16px; display: flex; gap: 16px; align-items: center; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header .spacer { flex: 1; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  a.card { display: block; color: inherit; text-decoration: none; }
  .muted { color: var(--muted); font-size: 14px; }
  .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .col h3 { margin: 0 0 8px; font-size: 15px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #eee; font-size: 13px; }
  .badge.problem { background: #ffebee; color: var(--danger); }
  button { font-size: 17px; padding: 12px 18px; border: 0; border-radius: 8px; cursor: pointer; background: var(--brand); color: #fff; }
  button.secondary { background: #fff; color: #333; border: 1px solid #ccc; }
  button.danger { background: var(--danger); }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px 6px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
  .msg.success { background: #e8f5e9; color: var(--ok); }
  .msg.error { background: #ffebee; color: var(--danger); }
  textarea, input, select { font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 100%; }
  .actions form { display: inline-block; margin: 0 8px 8px 0; }
  .qty { font-size: 20px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <a href="{% url 'staff:board' %}">🐾 Pet24 — заказы</a>
  <span class="spacer"></span>
  {% if user.is_authenticated %}
    <span>{{ user.first_name|default:user.phone }}{% if user.branch %} · {{ user.branch }}{% endif %}</span>
    <form method="post" action="{% url 'staff:logout' %}" style="margin:0">{% csrf_token %}<button class="secondary" style="padding:6px 10px;font-size:14px">Выйти</button></form>
  {% endif %}
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
