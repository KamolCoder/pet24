<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Вход · Pet24</title>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; font: 14px/1.45 system-ui, sans-serif; color: #1b1f27; }
@media (prefers-color-scheme: dark) { body { background: #0e1015; color: #e5e7eb; } .box { background: #161920 !important; border-color: #262a34 !important; } input { background: #0e1015; color: #e5e7eb; border-color: #262a34 !important; } }
.box { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 28px; width: 340px; }
h1 { font-size: 20px; margin: 0 0 18px; } h1 i { font-style: normal; color: #ff7300; }
label { display: block; font-size: 12px; color: #69707d; margin-bottom: 12px; }
input { display: block; width: 100%; height: 38px; margin-top: 4px; padding: 6px 10px; border: 1px solid #e3e6eb; border-radius: 7px; font: inherit; box-sizing: border-box; }
button { width: 100%; height: 40px; border: 0; border-radius: 7px; background: #b84d00; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
.err { background: #fde7e5; color: #b42318; padding: 8px 12px; border-radius: 7px; margin-bottom: 12px; }
</style></head>
<body><form class="box" method="post">{% csrf_token %}
  <h1><i>🐾</i> Pet24 · панель</h1>
  {% if form.errors %}<div class="err">Неверный телефон или пароль</div>{% endif %}
  <label>Телефон<input name="username" placeholder="90 123 45 67" autofocus required></label>
  <label>Пароль<input name="password" type="password" required></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button>Войти</button>
</form></body></html>
